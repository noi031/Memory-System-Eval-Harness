# 动态评测配置模板
# 使用大模型动态生成背景记忆和用户查询

# 评测模式: static | dynamic
mode: dynamic

# 主题池 (随机选择，或指定单个主题)
theme_pool:
  - "职场与项目管理"
  - "旅行规划与出行"
  - "健康管理与就医"
  - "学习与考试备考"
  - "社交活动与聚会"
  - "购物与消费决策"
  - "烹饪与饮食计划"
  - "运动与健身安排"
  - "宠物养护与训练"
  - "家庭财务与投资"
  - "子女教育与成长"
  - "房屋维修与改造"

# 指定主题 (为空则从主题池随机选择)
theme: ""

# 生成的背景记忆数量
num_memories: 10

# 每次测试的查询轮数
queries_per_test: 8

# 新会话概率 (0.0-1.0，用于测试跨会话召回)
new_session_ratio: 0.4

# LLM 配置 (用于生成记忆和查询)
llm_config:
  model: deepseek-v4-flash
  base_url: ""
  api_key: ""
  temperature: 0.8
  timeout: 120

# 精度评估 LLM 配置
evaluator_llm_config:
  model: deepseek-v4-flash
  base_url: ""
  api_key: ""
  temperature: 0.3
  timeout: 60

# EchoAgent 配置
echoagent:
  url: http://127.0.0.1:31020
  username: test_user
  password: test_password
  memory_engine_endpoint: http://127.0.0.1:31030

# EchoMem 配置
echomem:
  url: http://127.0.0.1:8010

# 打字模拟配置 (用于测试 prefill 预取)
typing_simulation:
  enabled: true
  speed_ms: 100
  jitter_ms: 20

# 输出配置
output:
  out_dir: runs/dynamic_eval/dynamic
  files:
    - full_results.json
    - runtime.json
    - accuracy.json
    - summary.json
    - results.csv
    - run.log

# 运行时指标采集
runtime_metrics:
  enabled: true
  echoagent_url: http://127.0.0.1:31020
  echomem_url: http://127.0.0.1:8010
  timeout: 10
