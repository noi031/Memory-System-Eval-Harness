# 记忆专项评估器配置
# 专注于记忆系统精度和速度评估

name: "memory_focused"
version: "1.0"
description: "记忆专项评估器 - 专注于记忆召回精度和速度"

# ============================================================
# 评估维度定义 (聚焦记忆)
# ============================================================
evaluation_dimensions:
  task_execution:
    enabled: false               # 禁用任务执行评估
    
  memory_recall:
    enabled: true
    weight: 1.0                  # 100%权重
    
    sub_dimensions:
      recall_accuracy:
        description: "召回准确性"
        weight: 0.25
        score_range: [0, 10]
        
      recall_completeness:
        description: "召回完整性"
        weight: 0.25
        score_range: [0, 10]
        
      entity_binding:
        description: "实体绑定准确性"
        weight: 0.20
        score_range: [0, 10]
        
      temporal_correctness:
        description: "时序正确性"
        weight: 0.15
        score_range: [0, 10]
        
      staleness_handling:
        description: "过期信息处理"
        weight: 0.15
        score_range: [0, 10]
        
  response_quality:
    enabled: false               # 禁用响应质量评估

# ============================================================
# 速度度量配置 (重点)
# ============================================================
speed_metrics:
  recall_latency:
    enabled: true
    unit: "ms"
    thresholds:
      excellent: 50
      good: 100
      acceptable: 200
      poor: 500
    # 详细记录
    detailed_logging: true
    
  prefill_latency:
    enabled: true
    unit: "ms"
    note: "打字期预取延迟，目标 < 80ms 防抖窗口"
    thresholds:
      excellent: 30
      good: 50
      acceptable: 80
      poor: 150
    detailed_logging: true
    
  e2e_latency:
    enabled: true
    unit: "ms"
    thresholds:
      excellent: 200
      good: 500
      acceptable: 1000
      poor: 2000
      
  # 吞吐量测试
  throughput:
    enabled: true
    unit: "QPS"
    test_duration_seconds: 60
    
  # 延迟分布记录
  latency_distribution:
    enabled: true
    percentiles: [50, 90, 95, 99]

# ============================================================
# 记忆操作探测配置 (参考 MemOps)
# ============================================================
memory_probes:
  # 六类操作探测
  operation_types:
    - "remember_probe"           # 存储探测
    - "retrieve_probe"           # 检索探测
    - "update_probe"             # 更新探测
    - "forget_probe"             # 遗忘探测
    - "reflect_probe"            # 反思探测
    - "compose_probe"            # 组合探测
    
  # 每类探测的详细配置
  probe_configs:
    remember_probe:
      description: "测试新信息是否被正确存储"
      test_cases:
        - "用户提供新偏好后能否召回"
        - "新增实体信息是否正确绑定"
        
    retrieve_probe:
      description: "测试相关记忆能否被正确召回"
      test_cases:
        - "直接查询已知信息"
        - "隐式引用测试"
        - "多事实综合查询"
        
    update_probe:
      description: "测试信息变更是否被正确更新"
      test_cases:
        - "属性值变更"
        - "状态切换"
        - "关联更新"
        
    forget_probe:
      description: "测试过期信息是否被正确处理"
      test_cases:
        - "明确废弃的信息"
        - "自动过期的信息"
        
    reflect_probe:
      description: "测试高层综合是否正确形成"
      test_cases:
        - "用户画像总结"
        - "偏好归纳"
        
    compose_probe:
      description: "测试复杂操作的组合执行"
      test_cases:
        - "同时更新多个相关记忆"
        - "跨实体操作"

# ============================================================
# Prompt模板配置
# ============================================================
prompts:
  # 记忆召回精度评估
  memory_accuracy_evaluation:
    template: |
      评估记忆召回的准确性。
      
      ## 用户查询
      {query}
      
      ## 期望召回的记忆
      {expected_memories}
      
      ## 实际召回的记忆
      {actual_memories}
      
      ## 评估要点
      
      1. 相关性: 召回的记忆是否与查询相关？
      2. 完整性: 是否遗漏了关键信息？
      3. 实体绑定: 信息是否绑定到正确实体？
      4. 时序正确: 时间相关信息是否准确？
      5. 时效性: 是否存在过期信息？
      
      输出JSON:
      {{
        "recall_accuracy_score": <0-10>,
        "recall_completeness_score": <0-10>,
        "entity_binding_score": <0-10>,
        "temporal_correctness_score": <0-10>,
        "staleness_handling_score": <0-10>,
        "true_positives": <数量>,
        "false_positives": <数量>,
        "false_negatives": <数量>,
        "precision": <0-1>,
        "recall": <0-1>,
        "f1_score": <0-1>,
        "missed_critical": ["<遗漏的关键记忆ID>"],
        "irrelevant_recalled": ["<不相关的召回ID>"],
        "stale_info_used": ["<使用的过期信息ID>"],
        "entity_binding_errors": [
          {{ "memory_id": "<ID>", "expected_entity": "<实体>", "actual_entity": "<实体>" }}
        ],
        "reason": "<中文解释>"
      }}
      
  # 速度评估报告
  speed_evaluation_report:
    template: |
      基于以下延迟数据生成速度评估报告。
      
      ## 召回延迟记录
      {recall_latency_records}
      
      ## Prefill延迟记录
      {prefill_latency_records}
      
      ## 端到端延迟记录
      {e2e_latency_records}
      
      生成JSON格式的评估报告:
      {{
        "recall_latency": {{
          "mean_ms": <平均延迟>,
          "median_ms": <中位数>,
          "p90_ms": <P90>,
          "p99_ms": <P99>,
          "rating": "<excellent|good|acceptable|poor>",
          "meets_target": true|false
        }},
        "prefill_latency": {{ ... }},
        "e2e_latency": {{ ... }},
        "overall_speed_score": <0-10>,
        "bottleneck_analysis": "<瓶颈分析>",
        "optimization_suggestions": ["<优化建议>"]
      }}

  # MemOps 风格的生命周期评估
  lifecycle_evaluation:
    template: |
      评估记忆生命周期操作的正确性。
      
      ## 操作类型
      {operation_type}
      
      ## 操作事件
      触发: {trigger}
      目标: {target}
      范围: {scope}
      状态转换: {state_transition}
      支持证据: {evidence}
      
      ## 实际执行结果
      {actual_result}
      
      评估:
      {{
        "operation_valid": true|false,
        "state_transition_correct": true|false,
        "scope_appropriate": true|false,
        "timing_correct": true|false,
        "score": <0-10>,
        "errors": ["<错误列表>"],
        "reason": "<中文解释>"
      }}

# ============================================================
# 基准测试配置
# ============================================================
benchmarks:
  # Recall@K 测试
  recall_at_k:
    enabled: true
    k_values: [1, 3, 5, 10]
    
  # MRR (Mean Reciprocal Rank)
  mrr:
    enabled: true
    
  # NDCG (Normalized Discounted Cumulative Gain)
  ndcg:
    enabled: true
    
  # 延迟基准
  latency_benchmark:
    enabled: true
    warmup_queries: 10
    test_queries: 100

# ============================================================
# LLM 配置
# ============================================================
llm_config:
  model: "deepseek-v4-flash"
  base_url: ""
  api_key: ""
  temperature: 0.2               # 低温度保证评估一致性
  max_tokens: 800
  timeout: 60

# ============================================================
# 评估元数据
# ============================================================
metadata:
  author: "Memory-System-Eval-Harness"
  created_at: "2025-01-20"
  tags:
    - "memory-focused"
    - "speed-critical"
    - "precision-metrics"
  references:
    - "MemOps (arXiv:2607.12893)"
    - "Generative Agents (arXiv:2304.03442)"
    - "BABILong (arXiv:2402.10790)"