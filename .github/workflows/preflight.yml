name: V3 Preflight

on:
  pull_request:
  push:
    branches:
      - v3
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Python compile checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile check
        run: |
          python -m py_compile dynamic/run_eval.py
          python -m py_compile benchmarks/locomo/run_eval.py
          python -m py_compile benchmarks/hotpotqa/run_eval.py
          python -m py_compile benchmarks/longmemeval/run_eval.py
          python -m py_compile shared/dataset.py shared/echomem_client.py shared/eval_base.py shared/judge.py shared/llm_client.py shared/qa.py
          python -m py_compile memory/dynamic_evaluator.py memory/llm.py memory/prompt_config_loader.py
