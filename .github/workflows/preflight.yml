name: V2 Validation

on:
  pull_request:
  push:
    branches:
      - v2
      - main
      - master

permissions:
  contents: read

jobs:
  validate:
    name: Source and public-boundary checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate
        run: node scripts/validate.mjs
