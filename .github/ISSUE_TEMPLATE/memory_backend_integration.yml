name: Memory backend integration
description: Ask for help connecting the EchoMem/EchoMemory backend.
title: "[Backend]: "
labels: ["memory-backend", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Current delivery scope is EchoMem/EchoMemory only. Do not include API keys, `.env.local`, `judge.conf`, `runs/`, or memory workspace files.
  - type: input
    id: backend
    attributes:
      label: Backend type
      value: EchoMem / EchoMemory
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Adapter doctor / contract result
      description: Paste the redacted output from `python scripts/backend_doctor.py --format json`.
      placeholder: "Status: ok/warn/fail..."
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime path or URL
      description: Use redacted/local path or service URL. Do not paste tokens.
      placeholder: "/absolute/path/to/EchoMem or http://127.0.0.1:19080"
  - type: textarea
    id: sdk_contract
    attributes:
      label: EchoMemory HTTP contract status
      description: Include the redacted health and backend doctor summary.
      placeholder: "Required failures: 0; warnings: ..."
  - type: textarea
    id: evidence_shape
    attributes:
      label: Evidence shape
      description: Paste a redacted example of evidence fields returned by your backend.
      placeholder: "{content, uri, score, trace} with private text removed"
  - type: textarea
    id: question
    attributes:
      label: Integration question
      placeholder: "What should I change so LoCoMo import or retrieval works?"
    validations:
      required: true
